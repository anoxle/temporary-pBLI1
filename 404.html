      if (p[i] !== '/') break;
      p = p.substring(0, i);
    }

  }

  };

  const path = resolveTarget(window.location.pathname);

  let tgt = redirectMap[path];

  if (path === "/temporary-pBLI1/launch-roblox") {
    tgt = "/temporary-pBLI1/assets/roblox-launch.html";
    preserveQuery = true;
  }

  if (tgt) {
    const destination = preserveQuery ? tgt + window.location.search : tgt;
    const ovl = document.getElementById("redirectOverlay");
    ovl.classList.add("visible");
    setTimeout(function () {
      window.location.replace(destination);
    }, 815);
  }
})();</script><script>window.NF_HOME = "/temporary-pBLI1/"</script><script src="https://anoxle.github.io/404.js"></script></body></html>
