<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="Anoxle"><title>Vulpes — Page Not Found (404)</title><link rel="icon" type="image/png" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png"><style>body {
  background: #0a0a0a;
  margin: 0;
  min-height: 100vh;
}

.sr-only {
  position: absolute;
  border: 0;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

.redirect-overlay {
  z-index: 9999;
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(9.5px);
  color: #fff;
  padding: 12px 24px;
  border-radius: 8px;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 14px;
  opacity: 0;
  transition: opacity 0.32s ease;
  pointer-events: none;
}

.redirect-overlay.visible {
  opacity: 1;
}</style></head><body><h1 class="sr-only">404 — This page doesn't exist</h1><div class="redirect-overlay" id="redirectOverlay">Redirecting to the correct page…</div><script>(function () {
  function resolveTarget(rawPath) {
    let p = rawPath;
    for (let i = p.length - 1; i >= 0; i--) {
      if (p[i] !== '/') break;
      p = p.substring(0, i);
    }
    return p;
  }

  const redirectMap = {
    "/legal/tos": "/legal/terms",
    "/terms": "/legal/terms",
    "/privacy": "/legal/privacy",
    "/tos": "/legal/terms",
    "/terms-of-service": "/legal/terms",
    "/privacy-policy": "/legal/privacy",
    "/legal/privacy-policy": "/legal/privacy",
    "/legal/terms-of-service": "/legal/terms",
    "/add": "/authorize",
    "/invite": "/authorize",
    "/support": "/discord",
    "/community": "/discord",
    "/discord-server": "/discord",
    "/server": "/discord",
    "/support-server": "/discord"
  };

  const path = resolveTarget(window.location.pathname);

  let tgt = redirectMap[path];
  let preserveQuery = false;

  if (path === "/launch-roblox") {
    tgt = "/assets/roblox-launch.html";
    preserveQuery = true;
  }

  if (tgt) {
    const destination = preserveQuery ? tgt + window.location.search : tgt;
    const ovl = document.getElementById("redirectOverlay");
    ovl.classList.add("visible");
    setTimeout(function () {
      window.location.replace(destination);
    }, 815);
  }
})();</script><script>window.NF_HOME = "/"</script><script src="https://anoxle.github.io/404.js"></script></body></html>
